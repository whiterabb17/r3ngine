version: '3.8'

services:
  temporal-python-orchestrator:
    # A worker host builds nothing, so the image must come from a registry
    # that holds a build of this fork.
    image: ${R3NGINE_IMAGE:?set R3NGINE_IMAGE to a registry image built from this fork}
    restart: always
    init: true
    entrypoint: /usr/src/app/temporal-entrypoint.sh
    command: ["--worker-name", "${WORKER_NAME}", "--worker-token", "${WORKER_AUTH_TOKEN}", "--r3ngine-url", "${MASTER_URL}"]
    environment:
      - DEBUG=${DEBUG:-0}
      - TEMPORAL_HOST=${TEMPORAL_HOST:-temporal:7233}
      - TEMPORAL_NAMESPACE=default
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_SSLMODE=${POSTGRES_SSLMODE}
      - DOMAIN_NAME=${DOMAIN_NAME}
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      # Remote worker configuration
      - WORKER_NAME=${WORKER_NAME}
      - WORKER_AUTH_TOKEN=${WORKER_AUTH_TOKEN}
      - MASTER_URL=${MASTER_URL}
      # The heartbeat verifies the master's TLS certificate. For the self-signed
      # one install.sh creates, mount its CA and point MASTER_CA_BUNDLE at it.
      - MASTER_CA_BUNDLE=${MASTER_CA_BUNDLE:-}
      - MASTER_TLS_VERIFY=${MASTER_TLS_VERIFY:-1}
    volumes:
      - ../web:/usr/src/app
      - github_repos:/usr/src/github
      - wordlist:/usr/src/wordlist
      - scan_results:/usr/src/scan_results
      - gf_patterns:/root/.gf
      - nuclei_templates:/root/nuclei-templates
    networks:
      - r3ngine_network

  temporal-go-executor:
    # Same app image as the orchestrator: the executor binary is built into it
    # (docker/web/Dockerfile, executor-builder stage); there is no separate Go image.
    image: ${R3NGINE_IMAGE:?set R3NGINE_IMAGE to a registry image built from this fork}
    restart: always
    init: true
    entrypoint: /usr/src/app/executor-entrypoint.sh
    # The executor polls go-executor-queue-${WORKER_NAME}, the queue the Python
    # orchestrator above routes this host's tool runs to (WORKER_NAME alone is
    # enough; the flag takes precedence when both are given).
    command: ["--worker-name", "${WORKER_NAME}"]
    environment:
      - TEMPORAL_HOST=${TEMPORAL_HOST:-temporal:7233}
      - TEMPORAL_NAMESPACE=default
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      - WORKER_NAME=${WORKER_NAME}
    volumes:
      # Tool output paths are handed over by the Python orchestrator, so the
      # shared volumes must be mounted at the same paths as in that service.
      - ../web:/usr/src/app
      - github_repos:/usr/src/github
      - wordlist:/usr/src/wordlist
      - scan_results:/usr/src/scan_results
      - gf_patterns:/root/.gf
      - nuclei_templates:/root/nuclei-templates
      - tool_config:/root/.config
      - ./temporal-go-executor/entrypoint.sh:/usr/src/app/executor-entrypoint.sh:ro
    networks:
      - r3ngine_network

volumes:
  scan_results:
  github_repos:
  wordlist:
  gf_patterns:
  nuclei_templates:
  tool_config:

networks:
  r3ngine_network:
    name: r3ngine_network
    driver: bridge
