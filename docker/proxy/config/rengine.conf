server {
    listen                                          8082 default;
    listen                                          [::]:8082 default;
    server_name                                     r3ngine recon;
    return                                          308 https://$host$request_uri;
}


server {
    listen                                          443 ssl;
    listen                                          [::]:443 ssl;
    http2                                           on;
    server_name                                     r3ngine recon;

    charset                                         utf-8;
    keepalive_timeout                               70;

    # Docker's embedded DNS. Without an explicit resolver nginx resolves an
    # upstream hostname once, at startup, and caches it forever — so recreating
    # the web container (a new address on the compose network) leaves nginx
    # proxying to an address nobody answers on, and every request is a 502 until
    # the proxy is restarted by hand. The `set` + variable below is what forces
    # re-resolution per request; a literal hostname in proxy_pass never re-resolves.
    resolver                                        127.0.0.11 valid=10s ipv6=off;
    resolver_timeout                                5s;

    client_max_body_size                            800M;

    gzip                                            on;
    gzip_comp_level                                 6;
    gzip_min_length                                 1024;
    gzip_vary                                       on;
    gzip_proxied                                    any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        image/svg+xml;

    location /mcp {
        proxy_http_version                          1.1;
        proxy_set_header                            Host $host;
        proxy_set_header                            Authorization $http_authorization;
        proxy_set_header                            X-Forwarded-Proto $scheme;
        proxy_set_header                            X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header                            X-MCP-Session-Id $http_x_mcp_session_id;
        proxy_read_timeout                          60s;
        # Resolved at request time, like the web upstream below: a literal host
        # here stops nginx from starting at all when the sidecar is not deployed,
        # which would take the UI down with it.
        set $mcp_upstream                           http://r3ngine-mcp:3100;
        proxy_pass                                  $mcp_upstream;
    }

    location / {
        proxy_read_timeout                          300;
        proxy_connect_timeout                       300;
        proxy_redirect                              off;

        proxy_set_header                            Host $host;
        proxy_set_header                            X-Real-IP $remote_addr;
        proxy_set_header                            X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header                            X-Forwarded-Proto $scheme;
        set                                         $web_upstream http://rengine:8000;
        proxy_pass                                  $web_upstream$request_uri;
    }

    location /ws/ {
        proxy_http_version                          1.1;
        proxy_set_header                            Upgrade $http_upgrade;
        proxy_set_header                            Connection "upgrade";
        proxy_read_timeout                          86400;
        proxy_connect_timeout                       300;
        proxy_redirect                              off;

        proxy_set_header                            Host $host;
        proxy_set_header                            X-Real-IP $remote_addr;
        proxy_set_header                            X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header                            X-Forwarded-Proto $scheme;
        set                                         $ws_upstream http://rengine:8000;
        proxy_pass                                  $ws_upstream$request_uri;
    }

    location /staticfiles/ {
        alias /usr/src/app/staticfiles/;
        # The Vite entry (assets/index.js), its CSS and the plugin remoteEntry.js
        # keep stable names, so the URL cannot tell a browser they changed.
        # With no header of our own, browsers fall back to heuristic freshness
        # and keep running the previous build after a deploy — a fix that is in
        # the code stays invisible. no-cache means "revalidate before use", not
        # "do not store": an unchanged file costs a 304.
        add_header Cache-Control "no-cache" always;
    }

    location /protected_media/ {
        internal;
        alias /usr/src/scan_results/;
        autoindex off;
    }

    ssl_protocols                                   TLSv1.2;

    ssl_certificate                                 /etc/nginx/certs/rengine.pem;                 # RSA certificate in PEM format.
    ssl_certificate_key                             /etc/nginx/certs/rengine_rsa.key;             # Secret key in PEM format.
    ssl_trusted_certificate                         /etc/nginx/certs/rengine_chain.pem;           # Certificate chain.

    ssl_ciphers                                     '!EDH:!EXP:!SHA:!DSS:EECDH+aRSA+AESGCM:EECDH+aRSA+SHA384:EECDH+aRSA+SHA256';  # Cipher suite (see https://tls.imirhil.fr/suite/ and `openssl ciphers | sed -r -e 's/:/\n/g'`).
    ssl_prefer_server_ciphers                       on;                                                 # Specifies that server ciphers should be preferred over client ciphers.

    # ssl_dhparam                                     /etc/ssl/private/private/dh4096.pem;                # Diffie-Hellman server params with 4096 bits (generated using `openssl dhparam 4096 -out /etc/ssl/private/private/dh4096.pem`).
    ssl_ecdh_curve                                  secp384r1:X25519:prime256v1;                        # Elliptic Curve Diffie-Hellman server params.

    ssl_session_cache                               shared:SSL:10m;                                     # Create a shared cache able to store about 80000 sessions (about 4000 for 1MB storage).
    ssl_session_timeout                             5m;                                                 # Timeout before session to be dropped.
    ssl_session_tickets                             off;                                                # Disable TLS session tickets.
}
