- model: scanEngine.enginetype
  pk: 12
  fields:
    engine_name: Comprehensive
    default_engine: false
    yaml_configuration: |
      subdomain_discovery:
        uses_tools:
          - subfinder
          - chaos
          - ctfr
          - sublist3r
          - tlsx
          - oneforall
          - netlas
          - baddns
        enable_http_crawl: true
        threads: 30
        timeout: 90
        bbot: true
      firewall_vpn_scan:
        run_ike_scan: true
        run_sslscan: true
        enable_testssl: true
        enable_crt_sh: true
        threads: 20
      dns_security:
        enable_axfr: true
        enable_dnssec_check: true
        enable_dns_brute: false
        amplification_threshold: 10
      http_crawl: {}
      port_scan:
        enable_http_crawl: true
        timeout: 5
        run_favirecon: true
        run_sourcemapper: true
        run_grpcurl: true
        run_julius: true
        run_gqlspection: true
        ports:
          - top-100
        rate_limit: 150
        threads: 20
        passive: false
        enable_nmap: true
        nmap_cmd: nmap -vv -Pn -sC 
        nmap_script: /usr/share/nmap/scripts/vulners.nse
        enable_network_enum: true
      osint:
        discover:
          - emails
          - metainfo
          - employees
        dorks:
          - login_pages
          - admin_panels
          - dashboard_pages
          - stackoverflow
          - social_media
          - project_management
          - code_sharing
          - config_files
          - jenkins
          - wordpress_files
          - php_error
          - exposed_documents
          - db_files
          - git_exposed
        intensity: normal
        documents_limit: 50
        emailfinder: true
        microsoft_recon: true
        leaks_and_secrets:
          leaklookup: true
          gitleaks: true
          trufflehog: true
          leaksearch: false
        api_leaks:
          porch_pirate: true
          postleaks: true
          swaggerspy: true
        github_analysis:
          uses_tools:
            - enumerepo
            - trufflehog
            - gitleaks
            - noseyparker
          gato: false
          github_orgs: []
        misconfig: true
        domain_security:
          spoofcheck: true
        dork_engines:
          - gofuzz
          - dorks_hunter
          - xnldorker
      dir_file_fuzz:
        auto_calibration: true
        run_dirsearch: true
        run_feroxbuster: false
        enable_http_crawl: true
        rate_limit: 150
        extensions:
          - html
          - php
          - git
          - yaml
          - conf
          - cnf
          - config
          - gz
          - env
          - log
          - db
          - mysql
          - bak
          - asp
          - aspx
          - txt
          - conf
          - sql
          - json
          - yml
          - pdf
        follow_redirect: true
        max_time: 300
        match_http_status:
          - 200
          - 204
        recursive_level: 2
        stop_on_error: false
        timeout: 30
        threads: 20
        wordlist_name: dicc
        use_api_wordlist: false
        max_repeat_by_signature: 10
      post_crawl_osint:
        metagoofil: true
        swaggerspy: true
      fetch_url:
        uses_tools:
          - gospider
          - hakrawler
          - waybackurls
          - katana
          - gau
          - vigolium
        remove_duplicate_endpoints: true
        duplicate_fields:
          - content_length
          - page_title
        enable_http_crawl: true
        gf_patterns:
          - debug_logic
          - idor
          - interestingEXT
          - interestingparams
          - interestingsubs
          - lfi
          - rce
          - redirect
          - sqli
          - ssrf
          - ssti
          - xss
        ignore_file_extensions:
          - png
          - jpg
          - jpeg
          - gif
          - mp4
          - mpeg
          - mp3
        threads: 20
      param_discovery:
        enabled: true
        min_confidence: 50
      web_api_discovery:
        uses_tools:
          - kiterunner
          - arjun
          - linkfinder
          - paramspider
          - semgrep
          - retire
          - jwt_tool
          - graphql-cop
        scan_only_active: true
        threads: 30
        kr_wordlist: routes-small.kite
        arjun_methods: GET,POST,JSON,XML,FETCH,PUT,DELETE,PATCH
      vulnerability_scan:
        run_nuclei: true
        run_smugglex: true
        run_second_order: true
        run_nuclei_dast: true
        run_dalfox: true
        run_crlfuzz: false
        run_acunetix: false
        run_wpscan: true
        run_wptaint_scan: true
        run_s3scanner: true
        enable_http_crawl: true
        concurrency: 30
        intensity: normal
        rate_limit: 150
        retries: 1
        timeout: 0
        fetch_gpt_report: true
        nuclei:
          use_nuclei_config: false
          max_templates_per_batch: 100
          severities:
            - unknown
            - info
            - low
            - medium
            - high
            - critical
        run_vigolium: true
        vigolium:
          strategy: balanced
          concurrency: 30
          rate_limit: 100
          timeout: 600s
        cpanel_scanner:
          run_cpanel2shell: true
          cpanel_user_wordlist: /usr/src/app/wordlist/cpanel_users.txt
          proxy_type: rotating
      vigolium_discovery:
        run_vigolium_discovery: true
        strategy: balanced
        concurrency: 20
        rate_limit: 50
        timeout: 300s
      vigolium_analysis:
        run_vigolium_analysis: true
        strategy: balanced
        concurrency: 20
        rate_limit: 50
        timeout: 600s
      waf_detection:
        use_shodan: true
        use_censys: true
      waf_bypass:
        use_nuclei: true
        use_benchmarking: true
      screenshot:
        enable_http_crawl: true
        intensity: normal
        timeout: 10
        threads: 40
      attack_path_modeling:
        enabled: true
        top_n: 10
      secret_scanning:
        trufflehog: true
        gitleaks: true
        leaklookup: true
      code_scan:
        grype: true
        trivy: true
      cidr_recon:
        use_arp: false
      host_recon:
        run_nuclei: true
        run_smugglex: true
        run_second_order: true
        run_nuclei_dast: true
      url_fuzz:
        fuzzers:
          - ffuf
          - feroxbuster
        hunt_secrets: true
      url_crawl:
        passive: false
        active: false
        hunt_secrets: true
      url_params_fuzz:
        fuzz_values: true
        hunt_secrets: true
      url_vuln:
        nuclei: true
      subdomain_recon:
        passive: false
        brute_dns: true
        bbot: true
      domain_recon:
        passive: false
